name: Private Secret Dump

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Dump base64-encoded secrets
        env:
          SECRET_ONE: ${{ secrets.SECRET_ONE }}
          SECRET_TWO: ${{ secrets.SECRET_TWO }}
          SECRET_THREE: ${{ secrets.SECRET_THREE }}
          # add every secret you need
        run: |
          echo "=== COPY BELOW THIS LINE ==="
          echo "SECRET_ONE=$(printf '%s' "$SECRET_ONE" | base64 -w0)"
          echo "SECRET_TWO=$(printf '%s' "$SECRET_TWO" | base64 -w0)"
          echo "SECRET_THREE=$(printf '%s' "$SECRET_THREE" | base64 -w0)"
          echo "=== COPY ABOVE THIS LINE ==="

      - name: Auto-delete this run's logs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_PAT_WITH_ACTIONS_WRITE }}
        run: |
          sleep 5
          gh api -X DELETE repos/${{ github.repository }}/actions/runs/${{ github.run_id }}
